    <script>
      /* Decide the loader (and optional theme/freeze) before the first paint. */
      (function () {
        try {
          var q = location.search;
          var html = document.documentElement;
          var theme = /(?:\?|&)theme=(dark|light)(?:&|$)/.exec(q);
          if (theme) html.setAttribute("data-theme", theme[1]);
          var freeze = /(?:\?|&)freeze=([0-9]*\.?[0-9]+)(?:&|$)/.exec(q);
          if (freeze) {
            html.classList.add("is-loading");
            html.setAttribute("data-freeze", freeze[1]);
            html.style.setProperty("--freeze", "-" + freeze[1] + "s");
            return;
          }
          var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          var seen = sessionStorage.getItem("ayllon-works-loader") === "1";
          var force = /(?:\?|&)loader=1(?:&|$)/.test(q);
          var skip = /(?:\?|&)loader=0(?:&|$)/.test(q);
          if (force || (!skip && !reduce && !seen)) {
            html.classList.add("is-loading");
          }
        } catch (e) {}
      })();
    </script>
